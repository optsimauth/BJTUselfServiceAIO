name: Release-mode test builds

on:
  push:
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android ARM64 release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: flutter pub get
      - run: flutter build apk --release --no-pub --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows release app
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build windows --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-app
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

  apple:
    name: macOS and iOS device release apps
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Build macOS release app
        run: flutter build macos --release --no-pub
      - name: Package macOS app
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No macOS .app bundle found in the build output directory." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" macos-release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-app
          path: macos-release.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build unsigned iOS device release app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package unsigned iOS device app
        run: |
          app_path="$(find build/ios/iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No iOS device .app bundle found in the build output directory." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ios-release-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned-app
          path: ios-release-unsigned.zip
          if-no-files-found: error
          retention-days: 30
