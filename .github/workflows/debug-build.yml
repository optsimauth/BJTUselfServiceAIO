name: Debug builds

on:
  push:
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows debug app
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build windows --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: windows-debug-app
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 30

  apple:
    name: macOS and iOS Simulator debug apps
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Build macOS debug app
        run: flutter build macos --debug --no-pub
      - name: Package macOS app
        run: |
          app_path="$(find build/macos/Build/Products/Debug -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No macOS .app bundle found in the build output directory." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" macos-debug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-debug-app
          path: macos-debug.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build iOS Simulator debug app
        run: flutter build ios --simulator --debug --no-pub
      - name: Package iOS Simulator app
        run: |
          app_path="$(find build/ios/iphonesimulator -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No iOS Simulator .app bundle found in the build output directory." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ios-simulator-debug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-debug-app
          path: ios-simulator-debug.zip
          if-no-files-found: error
          retention-days: 30
